{% extends "base.html" %}
{% block content %}
<h1 class="h3">{{ 'Add a row to' if adding else 'Edit a row in' }} {{ table }}</h1>
<form method="post" class="mt-3" style="max-width: 640px;">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  {% for c in cols %}
    {% set auto = adding and c['pk'] == 1 and (c['type'] or '')|upper == 'INTEGER' %}
    {% set locked = (not adding) and c['pk'] %}
    <div class="mb-3">
      <label class="form-label" for="f_{{ c['name'] }}">
        {{ c['name'] }}
        <span class="text-muted small">{{ c['type'] }}{% if c['notnull'] %}, required{% endif %}{% if c['pk'] %}, key{% endif %}</span>
      </label>
      <input class="form-control" id="f_{{ c['name'] }}" name="{{ c['name'] }}" type="text"
             value="{{ form.get(c['name'], '') if adding or form else ('' if row[c['name']] is none else row[c['name']]) }}"
             {% if locked %}disabled{% endif %}
             {% if auto %}placeholder="Leave blank to get the next number"{% endif %}>
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="{{ url_for('show_table', table=table) }}">Cancel</a>
</form>
{% endblock %}
